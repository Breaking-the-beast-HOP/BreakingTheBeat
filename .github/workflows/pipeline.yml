name: BreakingTheBeat Pipeline
on:
    push:
        branches: ["feature/**", "bugfix/**", "master"]
    pull_request:
        branches: ["feature/**", "bugfix/**", "master"]

jobs:
    linting:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET Core
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: 9.0.312

            - name: Setup NuGet
              uses: NuGet/setup-nuget@v1
              with:
                nuget-version: 'latest'

            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                path: ~/.nuget/packages
                key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
                restore-keys: |
                        ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore BreakingTheBeat.sln --verbosity detailed

            - name: Restore dotnet tools
              run: dotnet tool restore

            - name: Build solution
              run: dotnet build BreakingTheBeat.sln --configuration Release --verbosity detailed

            - name: Run linting (dotnet format)
              run: dotnet format --verify-no-changes --severity error
    
    tests:
      name: Gateway Unit tests (xUnit)
      runs-on: ubuntu-latest
      needs: linting
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: 9.0.312
        
        - name: Restore dependencies
          run: dotnet restore BreakingTheBeat.sln --verbosity detailed

        - name: Build solution
          run: dotnet build BreakingTheBeat.sln --configuration Release --verbosity detailed

        - name: Run unit tests with report
          run: dotnet test ./BreakingTheBeat.Tests/BreakingTheBeat.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"
        
        - name: Upload test results
          uses: actions/upload-artifact@v4
          with: 
            name: TestResults
            path: ./BreakingTheBeat.tests/TestResults/TestResults.trx
    
    security-scans:
      name: Secret Scanning (Gitleaks)
      runs-on: ubuntu-latest
      needs: [linting, tests]
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: 9.0.312
        
        - name: Setup NuGet
          uses: NuGet/setup-nuget@v1
          with:
            nuget-version: 'latest'
        
        - name: Restore
          run: dotnet restore --no-cache

        - name: Run Gitleaks
          uses: gitleaks/gitleaks-action@v1
          with: 
            args: detect --source . --verbose --redact
        
        - name: List vulnerable packages
          run: |
            dotnet list package --vulnerable --include-transitive | tee output.txt
            cat output.txt

            if grep -i "has the following vulnerable packages" output.txt; then
              echo "Vulnerabilities found!"
              exit 1
            else
              echo "No vulnerabilities found"
            fi
    
    container-scans:
      name: Container Security Scan
      runs-on: ubuntu-latest
      needs: [linting, security-scans]
      if: github.ref == 'refs/heads/master'
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Build gateway-image (no push)
          run: docker build -t gateway-test -f ./BreakingTheBeat/Dockerfile .

        - name: Scan gateway-image with Trivy
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            image-ref: gateway-test
            format: table
            exit-code: 1
            severity: CRITICAL,HIGH
            ignore-unfixed: true

        - name: Build frontend-image (no push)
          run: docker build -t frontend-test -f ./Frontend/Dockerfile ./Frontend

        - name: Scan frontend-image with Trivy
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            image-ref: frontend-test
            format: table
            exit-code: 1
            severity: CRITICAL,HIGH  
            ignore-unfixed: true

        - name: Build Monitoring-image (no-push)
          run: docker build -t monitoring-test -f ./Monitoring/Dockerfile ./Monitoring

        - name: Scan monitoring-image with Trivy
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            image-ref: monitoring-test
            format: table
            exit-code: 1
            severity: CRITICAL,HIGH
            ignore-unfixed: true

    docker-build-push:
      name: Docker Build and Push
      needs: [linting, container-scans]
      if: github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Log in to Github Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push Gateway Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./BreakingTheBeat/Dockerfile
            push: true
            tags: ghcr.io/breaking-the-beast-hop/breakingthebeat-gateway:latest
          env:
            DOCKER_BUILDKIT: 0

        - name: Build and push Frontend Docker image
          uses: docker/build-push-action@v5
          with:
            context: ./Frontend
            file: ./Frontend/Dockerfile
            push: true
            tags: ghcr.io/breaking-the-beast-hop/breakingthebeat-frontend:latest

        - name: Build and push Monitoring Docker image
          uses: docker/build-push-action@v5
          with:
            context: ./Monitoring
            file: ./Monitoring/Dockerfile
            push: true
            tags: ghcr.io/breaking-the-beast-hop/breakingthebeat-monitoring:latest

    deploy-to-server:
      name: Deploy to server
      needs: docker-build-push
      if: github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      steps:
#        - name: Checkout code
#          uses: actions/checkout@v4

        # Set up Tailscale VPN
        - name: Start Tailscale VPN
          uses: tailscale/github-action@v4
          with:
            authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
            tags: tag:ci
            ping: thecove.taile4ff41.ts.net

        # Test tailscale connection
        - name: Test Tailscale connection
          run: |
            ping -c 4 thecove.taile4ff41.ts.net
            echo "tailscale status:
              $(tailscale status)"
            echo "tailscale ip:
              $(tailscale ip -4)"

        # Deploy backend via SSH
        - name: Add SSH key
          uses: webfactory/ssh-agent@v0.5.4
          with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

        # Update docker containers on the server
        - name: SSH to server and deploy
          run: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@100.120.248.123 << 'EOF'
              echo "Logging in to GitHub Container Registry..."
              echo "${{ secrets.GITHUB_PAT }}" | docker login ghcr.io -u ${{ secrets.GITHUB_USERNAME }} --password-stdin
              echo "Connected to server. Deploying backend..."
              cd breakingthebeat
              docker compose down
              docker compose pull
              docker compose up -d --build
              echo "Backend deployed successfully."
            EOF

        # Notify deployment success
        - name: Notify Deployment Success
          run: echo "Backend deployed successfully to production server."

        # Stop Tailscale VPN
        - name: Stop Tailscale VPN
          run: sudo tailscale down