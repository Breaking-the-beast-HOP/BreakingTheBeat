name: BreakingTheBeat Pipeline
on:
    push:
        branches: ["feature/**", "bugfix/**", "master"]
    pull_request:
        branches: ["feature/**", bugfix/**, "master"]

jobs:
    linting:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET Core
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: 9.0.x

            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                path: ~/.nuget/packages
                key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                restore-keys: |
                        ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore BreakingTheBeat.sln --verbosity detailed

            - name: Restore dotnet tools
              run: dotnet tool restore

            - name: Build solution
              run: dotnet build BreakingTheBeat.sln --configuration Release --verbosity detailed

            - name: Run linting (dotnet format)
              run: dotnet format --verify-no-changes --severity error

    docker-build-push:
      name: Docker Build and Push
      needs: linting
      if: github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Log in to Github Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push Gateway Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./BreakingTheBeat/Dockerfile
            push: true
            tags: ghcr.io/breaking-the-beast-hop/breakingthebeat-gateway:latest

        - name: Build and push Frontend Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./FrontendThrowAway/FrontendThrowAway/Dockerfile
            push: true
            tags: ghcr.io/breaking-the-beast-hop/breakingthebeat-frontend:latest

    deploy-to-server:
      name: Deploy to server
      needs: docker-build-push
      if: github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        # Set up Tailscale VPN
        - name: Start Tailscale VPN
          uses: tailscale/github-action@v4
          with:
            authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
            tags: tag:ci
            ping: thecove.taile4ff41.ts.net

        # Test tailscale connection
        - name: Test Tailscale connection
          run: |
            ping -c 4 thecove.taile4ff41.ts.net
            echo "tailscale status:
              $(tailscale status)"
            echo "tailscale ip:
              $(tailscale ip -4)"

        # Deploy backend via SSH
        - name: Add SSH key
          uses: webfactory/ssh-agent@v0.5.4
          with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

        # Update docker containers on the server
        - name: SSH to server and deploy
          run: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@100.120.248.123 << 'EOF'
              echo "Logging in to GitHub Container Registry..."
              echo "${{ secrets.GITHUB_PAT }}" | docker login ghcr.io -u ${{ secrets.GITHUB_USERNAME }} --password-stdin
              echo "Connected to server. Deploying backend..."
              cd breakingthebeat
              docker compose down
              docker compose pull
              docker compose up -d --build
              echo "Backend deployed successfully."
            EOF

        # Notify deployment success
        - name: Notify Deployment Success
          run: echo "Backend deployed successfully to production server."

        # Stop Tailscale VPN
        - name: Stop Tailscale VPN
          run: sudo tailscale down