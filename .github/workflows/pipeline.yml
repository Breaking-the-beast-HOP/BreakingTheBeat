name: BreakingTheBeat Pipeline
on:
    push:
        branches: ["feature/**", "main"]
    pull_request:
        branches: ["feature/**", "main"]

jobs:
    linting:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET Core
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: 9.0.x

            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                path: ~/.nuget/packages
                key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                restore-keys: |
                        ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore BreakingTheBeat.sln --verbosity detailed

            - name: Restore dotnet tools
              run: dotnet tool restore

            - name: Build solution
              run: dotnet build BreakingTheBeat.sln --configuration Release --verbosity detailed

            - name: Run linting (dotnet format)
              run: dotnet format --verify-no-changes --severity error

    docker-build-push:
      name: Docker Build and Push
      needs: linting
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Log in to Github Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push Gateway Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./BreakingTheBeat/Dockerfile
            push: true
            tags: ghcr.io/breaking-the-beast-hop/breakingthebeat-gateway:latest

        - name: Build and push Frontend Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./FrontendThrowAway/FrontendThrowAway/Dockerfile
            push: true
            tags: ghcr.io/breaking-the-beast-hop/breakingthebeat-gateway:latest